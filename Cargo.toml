[package]
name = "handl-host-tensor"
version = "0.1.0"
edition = "2024"
description = "Host-side tensor functions for handl runtimes — an n-d dense array (f64) behind the `tensor.*` op surface."
license = "MIT"
repository = "https://github.com/handl-lang/exec-tensor"
readme = "README.md"
keywords = ["handl", "tensor"]
categories = ["science"]
homepage = "https://handl-lang.github.io/docs/host-tensor/"
documentation = "https://handl-lang.github.io/docs/host-tensor/"

[lib]
name = "handl_host_tensor"
# rlib for Rust consumers; cdylib carries the optional PyO3 binding
# (`--features python`, see src/python.rs) that mlopt's HostTensorSink
# loads as the `handl_host_tensor` extension module.
crate-type = ["rlib", "cdylib"]

[dependencies]
# ADR-0128 §Resolution: platform + lib-ops come from the sibling checkouts for
# local development (see the `[patch]` tables); CI resolves the git sources.
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
# handl-value — the `__tensor_bin__` wire codec + `TENSOR_BIN_THRESHOLD`
# (ADR-0179): decode_tensor's binary arm, encode_tensor's large-tensor
# spelling, and tensor.load's payload-as-wire path.
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
# P-013/T-149: atoms.yaml → {fn, sig} op registry (`src/atoms.rs`).
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# P-013 phase-2a (proposal-0012): `AtomProvider` self-registration —
# `src/kit.rs` submits the provider; dep binding collects it.
inventory = "0.3"
pyo3 = { version = "0.26", optional = true }
# Kit registration (`src/kit.rs`): `tensor` enters the shared
# `handl-kit-core` module table so kit-assembling hosts (kit-prelude's
# `hnl run`, `hnl-ext-tensor`) get the ops without inline wiring.
handl-kit-core = { git = "https://github.com/handl-lang/host", branch = "main" }
# P-013 T-152: `ffi.rust.resolve` atom handles — `src/ffi.rs` wraps
# `handl_kit_ffi::AtomHandle` so the PyO3 binding's `resolve`/
# `call_handle` surface resolves `tensor.*` (and any kit-table atom)
# through the same module table the `.hnl` op consults. Built without
# the `ffi` feature: resolution is feature-independent (handl atoms,
# not C symbols) and pulls no cranelift/libloading.
handl-kit-ffi = { git = "https://github.com/handl-lang/host", branch = "main", default-features = false }

[features]
# Python binding: `cargo build --features python` emits
# `libhandl_host_tensor.so` (rename to `handl_host_tensor.so` to import).
# Deliberately NOT `pyo3/extension-module` here: without it the cdylib
# links libpython and stays self-contained for non-Python dlopen.  The
# maturin wheel (pyproject.toml `[tool.maturin] features`) adds
# `pyo3/extension-module` — the normal extension-module contract, no
# libpython link — which is what `pip install` consumers get.
python = ["dep:pyo3"]

[dev-dependencies]
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
# Engine round-trip test (`tests/engine_roundtrip.rs`): run a `.hnl` program
# through the real `lex → parse → eval` pipeline so `tensor.*` host results
# decode to `TaggedValue::Tensor` inside the engine — not just across the
# `serde_json::Value` module chain `tests/compose.rs` covers.
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
hnl-exec-bytecode = { git = "https://github.com/handl-lang/exec-bytecode", branch = "main" }

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/exec"]
hnl-exec = { path = "../exec" }

[patch."https://github.com/handl-lang/exec-bytecode"]
hnl-exec-bytecode = { path = "../exec-bytecode" }

[patch."https://github.com/handl-lang/exec-tree-walk"]
hnl-exec-tree-walk = { path = "../exec-tree-walk" }

[patch."https://github.com/handl-lang/tool-lex"]
hnl-tool-lex = { path = "../tool-lex" }

[patch."https://github.com/handl-lang/tool-lex-pattern"]
hnl-tool-lex-pattern = { path = "../tool-lex-pattern" }

[patch."https://github.com/handl-lang/tool-parse"]
hnl-tool-parse = { path = "../tool-parse" }

[patch."https://github.com/handl-lang/tool-parse-pratt"]
hnl-tool-parse-pratt = { path = "../tool-parse-pratt" }

[patch."https://github.com/handl-lang/tool-transform"]
hnl-tool-transform = { path = "../tool-transform" }

[patch."https://github.com/handl-lang/tool-transform-rewrite"]
hnl-tool-transform-rewrite = { path = "../tool-transform-rewrite" }

[patch."https://github.com/handl-lang/tool-typecheck"]
hnl-tool-typecheck = { path = "../tool-typecheck" }

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }
# P-013 phase-2a: `handl-ops` carries `KernelAtomProvider` (the kernel
# atom-provider inventory `plugin-lib-handl::dep_atoms` collects);
# without this row the git copy predates it and the dep graph splits.
handl-ops = { path = "../kernel/crates/handl-ops" }

[patch."https://github.com/handl-lang/host"]
handl-kit-data = { path = "../host/crates/handl-kit-data" }
handl-kit-data-prelude = { path = "../host/crates/handl-kit-data-prelude" }
handl-platform = { path = "../host/crates/platform" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-lib-handl = { path = "../host/crates/plugin-lib-handl" }
handl-plugin-module = { path = "../host/crates/plugin-module" }
handl-kit-core = { path = "../host/crates/handl-kit-core" }
handl-kit-ffi = { path = "../host/crates/handl-kit-ffi" }
handl-runtime = { path = "../host/crates/handl-runtime" }


[patch."https://github.com/handl-lang/lib-char-native"]
handl-plugin-lib-char-native = { path = "../lib-char-native" }

