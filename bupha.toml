# bupha.toml — committed CI manifest for handl-lang/host-tensor.
#
# The runner is this repo's ci.sh (.hnl gate + the crate's Rust
# tests), executed natively in a detached worktree of the pushed sha.
# Merge the [[repos]] entry into the shared watcher
# (~/.config/bupha/bupha.toml), or run a dedicated instance with:
# bupha watch --config bupha.toml

[[repos]]
name = "handl-lang/host-tensor"
dir = "/home/luis/GitHub/handl-lang/host-tensor"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "bash ci.sh"
  cancel_running = true

[status]
kind = "github"
context = "ci/bupha"
